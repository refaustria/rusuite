[package]
name = "model-show"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# ts-rs derives on the model types (TypeScript definitions for Show,
# exported to apps/show/src/generated/ by `cargo test`).
ts = ["dep:ts-rs", "dep:app-common", "core-model/ts"]

[dependencies]
app-common = { path = "../app-common", optional = true }
core-model = { path = "../core-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }

[lints]
workspace = true
