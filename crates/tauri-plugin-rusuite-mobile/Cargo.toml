[package]
name = "tauri-plugin-rusuite-mobile"
description = "Rusuite's mobile document access (P10-M1): system document pickers, write-back, export, share sheet, Open with"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Tauri finds the plugin's Kotlin/Swift sources through the `links` metadata (DEP_TAURI_PLUGIN_RUSUITE_MOBILE_*).
links = "tauri-plugin-rusuite-mobile"

[lints]
workspace = true

[build-dependencies]
tauri-plugin = { version = "2.7.0", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Linux desktop PDF export (P10-M6): WebKitGTK's print-to-file through the webview handle (`with_webview` needs
# Tauri's `wry` feature). Both crates are already in the tree through `wry`; versions pinned to its.
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "=2.12.0", default-features = false, features = ["wry"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = "=0.18.2"
