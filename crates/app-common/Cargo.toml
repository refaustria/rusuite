[package]
name = "app-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"] }
serde_json.workspace = true
# Cloud connectors (P8-36, ADR 0009 amendment): desktop only, behind the features below; never in wasm.
quick-xml = { workspace = true, optional = true }
# rustls with the `ring` provider (no aws-lc / cmake); the platform verifier uses the OS trust store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
tauri = { version = "=2.12.0", default-features = false, optional = true }
base64 = { version = "=0.23.1", optional = true }

[features]
# `session::DirStorage` (std::fs; desktop shells only, never in wasm).
fs = []
# `webdav::WebDavClient`: the desktop WebDAV transport (HTTPS via rustls; plain HTTP only when the connection allows it).
webdav = ["dep:reqwest", "dep:rustls", "dep:quick-xml"]
# `connectors_tauri`: the `connector_*` commands of the three desktop shells (connection records in the app data
# directory, passwords in the OS keyring).
tauri-connectors = ["fs", "webdav", "dep:keyring", "dep:tauri", "dep:base64"]

[dev-dependencies]
core-model = { path = "../core-model" }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
