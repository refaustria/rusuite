name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --target wasm32-unknown-unknown -p core-model -p engine-formula -p model-sheet -p fmt-ooxml -p app-common -p app-calc-wasm -p write-core -p app-write-wasm -p fmt-pptx -p show-core -p app-show-wasm
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Generated TypeScript types are up to date
        run: |
          cargo test -p app-common -p calc-core -p show-core -p model-text -p write-core
          git diff --exit-code -- apps/calc/src/generated apps/write/src/generated apps/show/src/generated packages/ui-shared/src/generated
          test -z "$(git status --porcelain -- apps/calc/src/generated apps/write/src/generated apps/show/src/generated packages/ui-shared/src/generated)"

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy check (ADR 0009)
        run: scripts/privacy-check.sh
      - name: Version strings match (scripts/set-version.sh)
        run: scripts/check-versions.sh
      - name: Portal downloads page generator
        run: node --test scripts/gen-downloads.test.mjs
      - name: Store and signing script tests
        run: node --test scripts/store/*.test.mjs scripts/signing/*.test.mjs
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter calc build
      - run: pnpm --filter calc build:web
      - run: pnpm --filter write build
      - run: pnpm --filter write build:web
      - run: pnpm --filter show build
      - run: pnpm --filter show build:web
      - name: Pack the web builds for the e2e job
        run: tar czf dist-web.tgz apps/calc/dist-web apps/write/dist-web apps/show/dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist-web.tgz
          retention-days: 3

  e2e:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
      - run: tar xzf dist-web.tgz
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          retention-days: 7
