name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch or tag)"
        required: false
        default: ""
      tag:
        description: "Release tag name for the draft release"
        required: false
        default: "v0.0.0-test"

jobs:
  release:
    name: ${{ matrix.app }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        app: [calc, write, show]
        platform: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}-${{ matrix.platform }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "name=${{ inputs.tag || 'v0.0.0-test' }}" >> "$GITHUB_OUTPUT"; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Rusuite ${{ steps.tag.outputs.name }}"
          releaseBody: "Unsigned preview builds. Windows SmartScreen and macOS Gatekeeper will warn; see docs/release.md."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && '--target x86_64-apple-darwin' || '' }}
