name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch or tag)"
        required: false
        default: ""
      tag:
        description: "Release tag name for the draft release"
        required: false
        default: "v0.0.0-test"

jobs:
  versions:
    name: version strings
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # A tag push must match every version string (scripts/set-version.sh); a manual run only checks they agree.
      - shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then scripts/check-versions.sh "${GITHUB_REF_NAME#v}"; else scripts/check-versions.sh; fi

  release:
    name: ${{ matrix.app }} / ${{ matrix.platform }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        app: [calc, write, show]
        platform: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    # P10-S1 (docs/signing.md): each signing path is on only when its repository secrets exist; without them every
    # signing step is skipped and the builds are the unsigned ones of 3.141.
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WIN_PFX: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}-${{ matrix.platform }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then name="${GITHUB_REF_NAME}"; else name="${{ inputs.tag || 'v0.0.0-test' }}"; fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          # Public name (docs/versioning.md): without `v` and a trailing `.0` patch – v3.141.0 → "3.141"; v3.141.1 and
          # pre-releases stay as they are. Same rule as ui-shared's publicVersion and scripts/gen-downloads.mjs.
          v="${name#v}"
          if [[ "$v" =~ ^([0-9]+\.[0-9]+)\.0$ ]]; then v="${BASH_REMATCH[1]}"; fi
          echo "public=${v}" >> "$GITHUB_OUTPUT"
      # macOS: Tauri reads APPLE_* from the environment, signs (hardened runtime) and notarizes with the API key.
      - name: macOS signing material
        id: apple
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: scripts/signing/ci-macos-env.sh
      # Windows: Authenticode with a PFX imported into the user store, else (no PFX) Azure Trusted Signing. Either way
      # a config file merged with `tauri build --config` – tauri.conf.json itself stays unsigned.
      - name: Windows signing certificate (PFX)
        id: winpfx
        if: runner.os == 'Windows' && env.HAS_WIN_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rusuite-sign'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pfx = Join-Path $dir 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $cert = $certs | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) { throw 'WINDOWS_CERTIFICATE holds no certificate with a private key' }
          $config = (Join-Path $dir 'tauri.sign.json') -replace '\\', '/'
          node scripts/signing/tauri-sign-config.mjs pfx --thumbprint $cert.Thumbprint --out $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "args=--config $config" >> $env:GITHUB_OUTPUT
      - name: Windows signing via Azure Trusted Signing
        id: winazure
        if: runner.os == 'Windows' && env.HAS_WIN_PFX != 'true' && env.HAS_AZURE == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          source scripts/signing/lib.sh
          need AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_CERT_PROFILE
          # Tauri calls it once per file (app .exe, NSIS installer + uninstaller, MSI); it uses signtool + Azure CLI.
          cargo install artifact-signing-cli --version 0.12.0 --locked
          dir="$(cygpath -m "$RUNNER_TEMP")/rusuite-sign"
          mkdir -p "$dir"
          app="${{ matrix.app }}"
          node scripts/signing/tauri-sign-config.mjs azure --endpoint "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
            --description "Rusuite ${app^}" --out "$dir/tauri.sign.json"
          # artifact-signing-cli reads these from the environment of the tauri-action step.
          put AZURE_TENANT_ID "$AZURE_TENANT_ID"
          put AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
          put AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
          put AZURE_ARTIFACT_SIGNING_ACCOUNT "$AZURE_TRUSTED_SIGNING_ACCOUNT"
          put AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE "$AZURE_CERT_PROFILE"
          echo "args=--config $dir/tauri.sign.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Rusuite ${{ steps.tag.outputs.public }}"
          releaseBody: "Rusuite ${{ steps.tag.outputs.public }} – unsigned builds: Windows SmartScreen and macOS Gatekeeper warn once (steps: https://rusuit.es/downloads.html). Release notes: https://github.com/refaustria/rusuite/blob/main/docs/release-notes/${{ steps.tag.outputs.public }}.md – paste that file here before publishing (docs/release.md)."
          releaseDraft: true
          prerelease: true
          # The Windows signing steps add `--config <file>`; skipped (no secrets) their outputs are empty.
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && '--target x86_64-apple-darwin' || '' }}${{ steps.winpfx.outputs.args }}${{ steps.winazure.outputs.args }}
      - name: Verify the macOS signature
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        run: >-
          scripts/signing/verify-macos.sh
          "target/${{ matrix.platform == 'macos-latest' && 'aarch64' || 'x86_64' }}-apple-darwin/release/bundle/macos"
          "signing-record/${{ matrix.app }}-${{ matrix.platform }}.json" "${{ steps.apple.outputs.notarize }}"
      - name: Verify the Windows signatures
        if: runner.os == 'Windows' && (env.HAS_WIN_PFX == 'true' || env.HAS_AZURE == 'true')
        shell: pwsh
        run: |
          $method = if ($env:HAS_WIN_PFX -eq 'true') { 'pfx' } else { 'azure' }
          $files = @(Get-ChildItem target/release/bundle/msi/*.msi) + @(Get-ChildItem target/release/bundle/nsis/*-setup.exe) +
            @(Get-Item target/release/app-${{ matrix.app }}.exe)
          if ($files.Count -lt 3) { throw "expected an .msi, an NSIS -setup.exe and the app .exe, found $($files.Count)" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name): signature $($sig.Status) – $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name): signature without timestamp" }
            "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
          }
          New-Item -ItemType Directory -Force -Path signing-record | Out-Null
          "{`"os`":`"windows`",`"signed`":true,`"method`":`"$method`"}" | Out-File -Encoding ascii "signing-record/${{ matrix.app }}-${{ matrix.platform }}.json"
      - name: Keep the signing record for the manifest
        if: hashFiles('signing-record/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-${{ matrix.app }}-${{ matrix.platform }}
          path: signing-record/
          retention-days: 3
      - name: Remove signing material
        if: always() && runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Remove the signing certificate
        if: always() && steps.winpfx.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -Path "Cert:\CurrentUser\My\${{ steps.winpfx.outputs.thumbprint }}" -DeleteKey -ErrorAction SilentlyContinue
      - name: Keep the binary for the smoke job
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos-latest) bin=target/aarch64-apple-darwin/release/app-${{ matrix.app }} ;;
            macos-15-intel) bin=target/x86_64-apple-darwin/release/app-${{ matrix.app }} ;;
            windows-latest) bin=target/release/app-${{ matrix.app }}.exe ;;
            *) bin=target/release/app-${{ matrix.app }} ;;
          esac
          mkdir -p smoke-bin
          cp "$bin" smoke-bin/
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-bin-${{ matrix.app }}-${{ matrix.platform }}
          path: smoke-bin/
          if-no-files-found: error
          retention-days: 3

  # P8-41: start each built app once per OS with `--smoke` (window + ping/dispatch IPC round trip + title + version,
  # apps/*/src-tauri/src/smoke.rs). It runs the binaries the release jobs built (the same ones the bundles contain).
  # Blocking since 2026-10-16: the workflow_dispatch test run 38911314761 passed on all four runners (docs/release.md).
  smoke:
    name: smoke / ${{ matrix.platform }}
    needs: release
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: WebKitGTK runtime and a virtual display (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xvfb dbus
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-bin-*-${{ matrix.platform }}
          path: smoke-bin
          merge-multiple: true
      - name: Start Calc, Write and Show with --smoke
        shell: bash
        run: |
          chmod +x smoke-bin/* || true
          SMOKE_BIN_DIR="$PWD/smoke-bin" scripts/desktop-smoke.sh --start-only
