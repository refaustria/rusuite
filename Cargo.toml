[workspace]
resolver = "2"
members = [
    "crates/core-model",
    "crates/fmt-ooxml",
    "crates/fmt-docx",
    "crates/fmt-xlsx",
    "crates/fmt-pptx",
    "crates/model-text",
    "crates/model-sheet",
    "crates/engine-formula",
    "crates/model-show",
    "crates/app-common",
    "crates/tauri-plugin-rusuite-mobile",
    "apps/calc/src-tauri",
    "apps/calc/core",
    "apps/calc/src-wasm",
    "apps/write/core",
    "apps/write/src-tauri",
    "apps/write/src-wasm",
    "apps/show/core",
    "apps/show/src-tauri",
    "apps/show/src-wasm",
    "services/report-relay",
]

[workspace.package]
version = "3.141.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/refaustria/rusuite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
insta = "1"
proptest = "1"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep dev builds small on the shared dev server (three parallel worktrees): line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
