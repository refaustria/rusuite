[package]
name = "calc-core"
description = "Rusuite Calc document core shared by the Tauri and wasm shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobenches = false

[dependencies]
app-common = { path = "../../../crates/app-common" }
base64 = "=0.23.1"
core-model = { path = "../../../crates/core-model" }
engine-formula = { path = "../../../crates/engine-formula" }
fmt-xlsx = { path = "../../../crates/fmt-xlsx" }
model-sheet = { path = "../../../crates/model-sheet" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"] }

[lints]
workspace = true

# P5-4 perf harness: plain binaries/tests (no criterion), sources in benches/.
[[example]]
name = "bench_calc"
path = "benches/bench_calc.rs"

[[test]]
name = "perf"
path = "benches/perf.rs"
