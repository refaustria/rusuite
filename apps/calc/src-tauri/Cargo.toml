[package]
name = "app-calc"
description = "Rusuite Calc desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "app_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
calc-core = { path = "../core" }
base64 = "=0.23.1"
# `tauri-connectors`: the opt-in cloud connector commands (P8-36, ADR 0009 amendment).
app-common = { path = "../../../crates/app-common", features = ["fs", "tauri-connectors"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
