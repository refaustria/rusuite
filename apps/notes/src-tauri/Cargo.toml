[package]
name = "app-notes"
description = "Rusuite Notes desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "app_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

# Desktop only (P11-N7): Notes has no mobile app. The native core with the notebook folder
# store (`fs`) and the converters (`convert`); the webview still loads `app-notes-wasm`, for the sharing crypto only.
[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
# Export PDF (P11-X1, as Calc/Write/Show): the webview's own PDF renderer – WebKitGTK's print-to-file on Linux;
# elsewhere `DESKTOP_PDF` is false and the page keeps the print dialog ("Save as PDF"). Only its PDF helpers are
# used (Notes has no mobile app).
tauri-plugin-rusuite-mobile = { path = "../../../crates/tauri-plugin-rusuite-mobile" }
# OS file opens (P11-D1): a second start forwards its command line to the running instance.
tauri-plugin-single-instance = "=2.5.5"
notes-core = { path = "../core", features = ["fs", "convert"] }
# `tauri-connectors`: the OS keyring commands (sharing device keys, the AI key) – the WebDAV client comes with the
# feature but Notes never registers a connection.
app-common = { path = "../../../crates/app-common", features = ["fs", "tauri-connectors"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
