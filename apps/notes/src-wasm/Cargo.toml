[package]
name = "app-notes-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
# Without the converters (P11-N6b): they are in the lazily loaded `app-notes-convert-wasm` (../src-wasm-convert).
notes-core = { path = "../core", default-features = false }
notes-sync = { path = "../../../crates/notes-sync" }
serde_json = { workspace = true }


[lints]
workspace = true
