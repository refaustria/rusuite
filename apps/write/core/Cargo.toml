[package]
name = "write-core"
description = "Rusuite Write document core shared by the Tauri and wasm shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobenches = false

[dependencies]
app-common = { path = "../../../crates/app-common" }
core-model = { path = "../../../crates/core-model" }
fmt-docx = { path = "../../../crates/fmt-docx" }
model-text = { path = "../../../crates/model-text", features = ["ts"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }

[lints]
workspace = true

# P5-4 perf harness: plain binaries/tests (no criterion), sources in benches/.
[[example]]
name = "bench_write"
path = "benches/bench_write.rs"

[[test]]
name = "perf"
path = "benches/perf.rs"
