# Rusuite Notes relay (P11-N5a). Include from the TLS server block of deploy/nginx/rusuit.es.conf, e.g. copy to
# /etc/nginx/snippets/rusuite-notes.conf and add `include /etc/nginx/snippets/rusuite-notes*.conf;` next to the
# report relay's include. Same origin as the apps, so the web CSP stays connect-src 'self' (CSP 'self' matches
# wss:// on the same host). The relay listens on 127.0.0.1:8732 (deploy/notes-relay.service).
# Privacy (spec 4.4): no access log for /api/notes/ – the relay stores no IP addresses and nginx should not either.

# WebSocket: long-lived, binary frames up to one blob (25 MB) – frames are limited by the relay itself.
location = /api/notes/ws {
    proxy_pass http://127.0.0.1:8732;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    access_log off;
}

# Health check and DELETE /api/notes/notebooks/<id> ("stop sharing", a small signed body).
location /api/notes/ {
    proxy_pass http://127.0.0.1:8732;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 4k;
    access_log off;
}
