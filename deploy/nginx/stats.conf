# Owner-only stats (deploy/stats/, deploy/README.md "Traffic and download stats"). Install as
# /etc/nginx/snippets/rusuite-stats.conf; rusuit.es.conf includes it with `include /etc/nginx/snippets/rusuite-stats*.conf;`.
# Basic auth; the htpasswd file lives on the host only, never in the repo. GoAccess HTML embeds its scripts and
# styles inline (its templates use new Function), so /stats/ has its own CSP with 'unsafe-inline'/'unsafe-eval',
# still without any external source; it serves nothing but the generated reports. The owner's visits are not logged.
location = /stats { return 301 /stats/; }
location /stats/ {
    alias /var/www/rusuite-stats/;
    index index.html;
    auth_basic "Rusuite stats";
    auth_basic_user_file /etc/nginx/rusuite-stats.htpasswd;
    access_log off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy $permissions_policy always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
