# Rusuite web target (ADR 0005). Static files only; / is the portal (apps/portal). HTTP only here;
# `certbot --nginx` adds the TLS server block and the redirect.
server {
    server_name resuite.inceptum.at;

    # "Report a problem" relay (P8-43); the glob keeps nginx -t passing without the snippet.
    include /etc/nginx/snippets/rusuite-report*.conf;

    root /var/www/resuite;
    index index.html;

    access_log /var/log/nginx/resuite.access.log;
    error_log  /var/log/nginx/resuite.error.log;


    # Privacy (ADR 0009): documents never leave the device, so the page may only talk to its own origin.
    # nginx drops server-level add_header lines in any location that has its own add_header, so every
    # location repeats the security headers; the policy itself is defined once here.
    # >>> connect-src: the ONLY line to extend with user-enabled cloud provider origins (docs/cloud-connectors-plan.md) <<<
    set $csp_connect "'self'";
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src $csp_connect; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";
    set $permissions_policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()";

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy $permissions_policy always;

    # Portal (apps/portal): index.html, styles.css, logos/. Not hashed, so revalidate.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files /index.html =404;
    }

    location = /styles.css {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
    }

    location /logos/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
    }

    # Hashed build output: cache for a year.
    location /calc/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri =404;
    }

    location = /calc/ { rewrite ^ /calc/index.html last; }

    location = /calc/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
    }

    location /calc/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri /calc/index.html;
    }

    location /write/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri =404;
    }

    location = /write/ { rewrite ^ /write/index.html last; }

    location = /write/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
    }

    location /write/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri /write/index.html;
    }

    location /show/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri =404;
    }

    location = /show/ { rewrite ^ /show/index.html last; }

    location = /show/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
    }

    location /show/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        try_files $uri /show/index.html;
    }



    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/resuite.inceptum.at/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/resuite.inceptum.at/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = resuite.inceptum.at) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name resuite.inceptum.at;
    return 404; # managed by Certbot


}