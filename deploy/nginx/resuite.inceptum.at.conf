# Rusuite web target (ADR 0005). Static files only. HTTP only here;
# `certbot --nginx` adds the TLS server block and the redirect.
server {
    server_name resuite.inceptum.at;

    root /var/www/resuite;
    index index.html;

    access_log /var/log/nginx/resuite.access.log;
    error_log  /var/log/nginx/resuite.error.log;


    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /calc/; }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output: cache for a year.
    location /calc/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /calc/ { rewrite ^ /calc/index.html last; }

    location = /calc/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /calc/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /calc/index.html;
    }

    # Prepared for later apps:
    # location /write/ { try_files $uri $uri/ /write/index.html; }
    # location /show/  { try_files $uri $uri/ /show/index.html; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/resuite.inceptum.at/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/resuite.inceptum.at/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = resuite.inceptum.at) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name resuite.inceptum.at;
    return 404; # managed by Certbot


}